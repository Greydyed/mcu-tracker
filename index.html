<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCU Tracker</title>

<style>
body{
  margin:0;
  background:#080b22;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding:16px
}

h1{
  text-align:center;
  color:#e8a33d;
}

#progress{
  text-align:center;
  color:#c9c4ea;
  margin:15px;
}

.card{
  background:#151936;
  border-radius:18px;
  padding:12px;
  margin:12px 0;
  display:flex;
  gap:14px;
}

.poster{
  width:90px;
  height:135px;
  object-fit:cover;
  border-radius:12px;
}

.info{
  flex:1;
}

.title{
  font-size:18px;
  font-weight:700;
}

.eng{
  color:#c9c4ea;
}

.meta{
  margin-top:8px;
  color:#e8a33d;
}

button{
  margin-top:8px;
  background:#e8a33d;
  border:0;
  border-radius:10px;
  padding:8px 12px;
  font-weight:bold;
}

input{
  width:45px;
  background:#080b22;
  color:white;
  border:1px solid #e8a33d;
  border-radius:6px;
  padding:5px;
}

.watched{
  opacity:.55;
}
</style>
</head>

<body>

<h1>MARVEL MCU</h1>

<div id="progress"></div>

<div id="list"></div>


<script>

const GIST_URL =
"https://gist.githubusercontent.com/Greydyed/b298d0f03d5a5c27ccb4ae2ee164987a/raw/57555f9a9bbc77149970fa19b7e4f1494fb4ae15/mcu_data.json";


const OMDB="fa6ef37";


let saved =
JSON.parse(localStorage.getItem("mcu_scores") || "{}");


async function load(){

const data =
await fetch(GIST_URL+"?t="+Date.now())
.then(r=>r.json());


const movies=data.movies;


const list=document.getElementById("list");


function updateProgress(){

let count =
movies.filter(m=>saved[m.id]?.watched).length;

document.getElementById("progress").innerHTML =
"Просмотрено: "+count+" / "+movies.length;

}


for(const movie of movies){

let old=saved[movie.id] || {
 watched:false,
 sergey:"",
 ulyana:""
};


let poster=
"https://via.placeholder.com/90x135?text=MCU";


let rating="—";


try{

let omdb =
await fetch(
"https://www.omdbapi.com/?t="+
encodeURIComponent(movie.title)+
"&y="+movie.year+
"&apikey="+OMDB
).then(r=>r.json());


if(omdb.Poster && omdb.Poster!="N/A")
poster=omdb.Poster;


rating=omdb.imdbRating || "—";


}catch(e){}



let card=document.createElement("div");

card.className="card "+
(old.watched?"watched":"");


card.innerHTML=`

<img class="poster" src="${poster}">

<div class="info">

<div class="title">
${movie.ru}
</div>

<div class="eng">
${movie.title}
</div>


<div class="meta">
${movie.year}
<br>
IMDb: ${rating}
</div>


<div>
<label>
<input type="checkbox" 
${old.watched?"checked":""}>
Просмотрено
</label>
</div>


<div>
Сергей ⭐ 
<input value="${old.sergey}" 
placeholder="0-10"
class="sergey">
</div>


<div>
Ульяна ⭐ 
<input value="${old.ulyana}" 
placeholder="0-10"
class="ulyana">
</div>


</div>
`;



let checkbox =
card.querySelector("input[type=checkbox]");


let sergey =
card.querySelector(".sergey");


let ulyana =
card.querySelector(".ulyana");



function save(){

saved[movie.id]={
 watched:checkbox.checked,
 sergey:sergey.value,
 ulyana:ulyana.value
};


localStorage.setItem(
"mcu_scores",
JSON.stringify(saved)
);


card.className=
"card "+
(checkbox.checked?"watched":"");


updateProgress();

}



checkbox.onchange=save;

sergey.onchange=save;

ulyana.onchange=save;



list.appendChild(card);


}


updateProgress();


}


load();


</script>

</body>
</html>
